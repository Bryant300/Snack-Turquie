<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
    <title id="title">Logo halal</title>
    <desc id="desc">Logo rond noir et blanc avec la mention halal.</desc>
    <circle cx="128" cy="128" r="112" fill="none" stroke="#050505" stroke-width="8"/>
    <text x="128" y="125" fill="#050505" direction="rtl" text-anchor="middle"
